  db: null, col: null, timers: {},

    if (!Array.isArray(S.cooking)) S.cooking = [];

      const old = JSON.parse(localStorage.getItem("sprig:active") || "null");
      if (old) { S.cooking.push({ ...old, cid: uid() }); localStorage.removeItem("sprig:active"); this.save("cooking"); }
    } catch (e) {}
  },
  async connect() {
    try {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.db = db; this.col = db.collection("data/users/" + id);
      let found = false;
      for (const k of KEYS) {
        const snap = await this.col.doc(k).get();
        if (snap.exists) { S[k] = snap.data().v; found = true; }
      }
      if (!Array.isArray(S.cooking)) S.cooking = [];
      const old = await this.col.doc("active").get();
      if (old.exists && old.data().v) { S.cooking.push({ ...old.data().v, cid: uid() }); this.save("cooking"); this.col.doc("active").delete().catch(() => {}); }
      if (!found) for (const k of KEYS) this.save(k);   // first visit: push anything kept locally
      if (S.profile.signedIn && S.profile.onboarded && ui.screen !== "app") ui.screen = "app";
      render();
    } catch (e) { /* keep using browser storage */ }
  },
  save(k) {
    try { localStorage.setItem("sprig:" + k, JSON.stringify(S[k])); } catch (e) {}
    if (!this.col) return;
    clearTimeout(this.timers[k]);

async function generate(fresh) {

  }
  ui.sampleMode = false;
  ctl = new AbortController();
  const opts = { modelTier: "default", signal: ctl.signal, onText: ({ text }) => {
    const n = Math.min(10, (text.match(/"name"\s*:/g) || []).length);
    if (n !== ui.gen?.found) { ui.gen.found = n; paintProgress(); }
  } };
  if (fresh) opts.cache = false;
  try {
    const list = await sample.json(listPrompt(), opts);
    const arr = Array.isArray(list) ? list : (list?.recipes || []);
    if (!arr.length) throw { code: "invalid_json" };
    ui.results = arr.slice(0, 12).map(normalizeRecipe);

  } catch (e) {

}

function addIngredients(list) {
  const have = new Set(ui.ingredients.map(s => s.toLowerCase()));
  for (let s of list) {
    s = String(s).trim().replace(/\s+/g, " ").toLowerCase();
    if (s && s.length < 40 && !have.has(s)) { ui.ingredients.push(s); have.add(s); }
  }
}

}

      : "Didn't catch that. Try again, or type into the box below."; };
    rec.onend = () => { ui.voice.live = false; render(); };
    rec.start(); ui.voice.live = true; ui.voice.err = ""; render();
  } catch (e) { ui.voice.err = "Voice capture couldn't start. Dictate or type into the box below."; render(); }
}

/* ---------- filters ---------- */
function filtered() {
  const f = ui.filters;
  let list = ui.results.filter(r =>
    (f.time === "any" || r.time <= +f.time) &&
    (f.buy === "any" || r.buy.length <= +f.buy) &&
    (f.cuisine === "any" || r.cuisine === f.cuisine));
  const by = { time: (a, b) => a.time - b.time, buy: (a, b) => a.buy.length - b.buy.length || a.time - b.time, cal: (a, b) => (a.calories || 999) - (b.calories || 999) }[f.sort];
  return by ? [...list].sort(by) : list;
}
const activeFilters = () => ["time","buy","cuisine"].filter(k => ui.filters[k] !== "any").length;

/* ---------- grocery / history ---------- */
function cookRecipe(r) {
  const names = new Set(S.grocery.map(g => g.name.toLowerCase()));
  const toBuy = r.detail ? r.detail.ingredients.filter(i => !i.have).map(i => i.item) : r.buy;
  let added = 0;
  for (const n of toBuy) if (!names.has(n.toLowerCase())) { S.grocery.push({ id: uid(), name: n, recipe: r.name, done: false }); names.add(n.toLowerCase()); added++; }
  if (!S.cooking.some(c => c.name === r.name)) S.cooking.push({ ...JSON.parse(JSON.stringify(r)), cid: uid() });
  save("cooking", "grocery");
  ui.tab = "today"; ui.view = "home"; ui.fromActive = false;
  if (added) toast(`${added} item${added > 1 ? "s" : ""} added to your grocery list`);
}
function markCooked(cid) {
  const r = S.cooking.find(c => c.cid === cid); if (!r) return;
  const { cid: _, ...recipe } = r;
  const entry = { id: uid(), recipe, cookedAt: Date.now(), rating: 0, notes: "", changes: "" };
  S.history.unshift(entry); S.cooking = S.cooking.filter(c => c.cid !== cid);
  save("history", "cooking");
  ui.tab = "past"; ui.view = "home"; ui.sheet = { type: "past", id: entry.id, draft: { rating: 0, notes: "", changes: "" } };
  toast("Nice work. How did it turn out?");
}

  const q = encodeURIComponent(`${src.creator} ${src.title}`);

    Reddit: ["Reddit", "https://www.reddit.com/search/?q=" + encodeURIComponent(name + " recipe")],
    Web: ["Web", "https://www.google.com/search?q=" + encodeURIComponent(`${src.creator} ${src.title} recipe`)]
  };
  const first = src.platform === "YouTube" ? "YouTube" : src.platform === "Reddit" ? "Reddit" : "Web";
  return [links[first], ...Object.entries(links).filter(([k]) => k !== first).map(([, v]) => v)];
}

    </div>
    ${d ? `<div class="card sect"><h2>Steps</h2><ol class="steps">${d.steps.map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol></div>
      ${d.tips?.length ? `<div class="note"><strong style="color:var(--text)">Tips</strong><br>${d.tips.map(esc).join("<br>")}</div>` : ""}` : ""}
    ${r.source ? `<div class="sect" style="gap:4px;padding:4px 4px 0">
      <span class="eyebrow">Where it's from</span>
      <p class="small">${esc(r.source.creator)} · “${esc(r.source.title)}” (${esc(r.source.platform)})${r.why ? `. ${esc(r.why)}` : ""}</p>
      <p class="small">Find the original: ${sourceLinks(r.source, r.name).map(([l, u]) => `<a class="link" href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`).join(" · ")}. Ratings and view counts aren't checked live yet.</p>
    </div>` : ""}
    <div class="sticky">${active
      ? `<button class="btn green" data-act="mark-cooked" data-v="${active.cid}">${ic("check", 18)} Mark as cooked</button>`
      : `<button class="btn" data-act="cook" ${d ? "" : "disabled"}>Cook this recipe</button>`}</div>`;
}

function vGrocery() {
  const items = S.grocery, done = items.filter(i => i.done).length;
  const groups = {};
  for (const it of items) (groups[it.recipe || ""] ||= []).push(it);
  const keys = Object.keys(groups).sort((a, b) => (a === "") - (b === ""));
  return `<div class="top"><h1>Grocery list</h1>${items.length ? `<button class="btn sec sm" data-act="copy-list">${ic("copy", 16)} Copy</button>` : ""}</div>
    <form class="addrow" id="groc-form"><input class="input" id="groc-input" placeholder="Add an item" autocomplete="off" aria-label="Add a grocery item"><button class="iconbtn" type="submit" aria-label="Add item">${ic("plus", 22)}</button></form>
    <div class="panel">${items.length ? keys.map(k => `<div class="ph"><span class="eyebrow">${k ? "For " + esc(k) : "Other items"}</span><span class="small">${groups[k].filter(i => !i.done).length} left</span></div>
      ${groups[k].map(it => `<label class="check ${it.done ? "done" : ""}"><input type="checkbox" data-act="tog-groc" data-v="${it.id}" ${it.done ? "checked" : ""}><span class="grow">${esc(it.name)}</span><button type="button" class="iconlink" style="margin-right:-10px" data-act="rm-groc" data-v="${it.id}" aria-label="Remove ${esc(it.name)}">${ic("x", 16)}</button></label>`).join("")}`).join("")
      : `<div class="empty"><div class="ico">${ic("list", 30)}</div><h2>Your list is empty</h2><p>Choose a recipe on the Today tab and tap "Cook this recipe". Anything you're missing shows up here.</p></div>`}</div>
    ${done ? `<button class="btn ghost" data-act="clear-checked">Clear ${done} checked item${done > 1 ? "s" : ""}</button>` : ""}`;
}

function vPast() {
  const h = S.history;
  return `<div class="top"><h1>Past recipes</h1>${h.length ? `<span class="pill plain">${h.length} cooked</span>` : ""}</div>
    <div class="panel">${h.length ? h.map(e => `<button class="rcard" data-act="open-past" data-v="${e.id}">
        <div class="row1"><h3>${esc(e.recipe.name)}</h3>${e.rating ? `<span class="stars" aria-label="${e.rating} of 5 stars" style="color:var(--accent)">${ic("star", 14, "currentColor").repeat(e.rating)}</span>` : `<span class="pill">Add notes</span>`}</div>
        <div class="meta"><span>${fmtDate(e.cookedAt)}</span>${e.recipe.source ? `<span>${esc(e.recipe.source.creator)}</span>` : ""}${e.recipe.cuisine ? `<span>${esc(e.recipe.cuisine)}</span>` : ""}<span>${ic("clock", 14)} ${e.recipe.time} min</span></div>
        ${e.notes ? `<p>${esc(e.notes.length > 110 ? e.notes.slice(0, 110) + "…" : e.notes)}</p>` : ""}
        ${e.changes ? `<p><span style="color:var(--text)">Next time:</span> ${esc(e.changes.length > 90 ? e.changes.slice(0, 90) + "…" : e.changes)}</p>` : ""}
      </button>`).join("")
      : `<div class="empty"><div class="ico">${ic("book", 30)}</div><h2>No recipes cooked yet</h2><p>When you mark a recipe as cooked, it lands here so you can note how it went and what you'd change.</p><button class="btn sm" data-act="tab" data-v="today">Find something to cook</button></div>`}</div>`;
}

function vSheet() {
  const sh = ui.sheet; if (!sh) return "";
  if (sh.type === "settings") return `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-label="Profile and kitchen" data-stop>
      <div class="grab"></div>
      <div class="top"><div class="row" style="display:flex;gap:12px;align-items:center"><span class="av">${esc(initials())}</span><div><h2>${esc(S.profile.name || "Guest")}</h2><p class="small">${S.profile.method === "google" ? "Signed in with Google" : "Username account"}</p></div></div>
        <button class="btn ghost sm" data-act="close-sheet" aria-label="Close">${ic("x", 20)}</button></div>
      <div class="sect"><span class="eyebrow">Your appliances</span>${vAppliances(true)}</div>
      <div class="sect"><span class="eyebrow">Favorite cuisines</span>${vCuisinePrefs(true)}</div>
      <button class="btn" data-act="close-sheet">Done</button>
    </div></div>`;
  const e = S.history.find(x => x.id === sh.id); if (!e) return "";
  const d = sh.draft, r = e.recipe;
  return `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-label="${esc(r.name)} notes" data-stop>
    <div class="grab"></div>
    <div class="top"><div><span class="eyebrow">Cooked ${fmtDate(e.cookedAt)}</span><h2 style="margin-top:4px">${esc(r.name)}</h2></div><button class="btn ghost sm" data-act="close-sheet" aria-label="Close">${ic("x", 20)}</button></div>
    <div class="sect"><span class="eyebrow">How did it turn out?</span>
      <div class="stars" role="radiogroup" aria-label="Rating">${[1,2,3,4,5].map(n => `<button role="radio" aria-checked="${d.rating === n}" aria-label="${n} star${n > 1 ? "s" : ""}" class="${n <= d.rating ? "on" : ""}" data-act="rate" data-v="${n}">${ic("star", 30, "currentColor")}</button>`).join("")}</div>
    </div>
    <label class="field">Notes<textarea class="input" id="past-notes" data-model="notes" placeholder="e.g. Sauce was perfect, kids loved it. A bit too salty.">${esc(d.notes)}</textarea></label>
    <label class="field">What would you change next time?<textarea class="input" id="past-changes" data-model="changes" placeholder="e.g. Half the chili, add lime at the end, double the garlic.">${esc(d.changes)}</textarea></label>
    <button class="btn green" data-act="save-past">Save notes</button>
    ${r.detail ? `<details class="card"><summary style="cursor:pointer;font-weight:500">Recipe</summary>
      <div class="ilist" style="margin-top:10px">${r.detail.ingredients.map(i => `<div class="irow"><span class="grow">${esc(i.item)}</span><span class="qty">${esc(i.qty)}</span></div>`).join("")}</div>
      <ol class="steps" style="margin-top:14px">${r.detail.steps.map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol></details>` : ""}
    <button class="btn sec" data-act="cook-again">Cook this again</button>
  </div></div>`;
}

function appBar() {
  const BACK = { method: ["go-home"], photo: ["view","method"], voice: ["view","method"], review: ["view","method"],
    cuisine: ui.mode === "have" ? ["view","review"] : ["go-home"], loading: ["stop"], results: ["view","cuisine"],
    detail: [ui.fromActive ? "go-home" : "back-results"] };
  const b = ui.tab === "today" ? BACK[ui.view] : null;
  return `<header class="appbar">
    ${b ? `<button class="iconlink" data-act="${b[0]}"${b[1] ? ` data-v="${b[1]}"` : ""} aria-label="Back">${ic("back", 24)}</button>`
        : `<button class="iconlink" data-act="open-menu" aria-label="Open menu" aria-expanded="${!!ui.menu}">${ic("menu", 24)}</button>`}
    <span class="brand"><span class="mark">${ic("sprig", 20)}</span>reciMe</span>
    <span class="iconlink" aria-hidden="true"></span>
  </header>`;
}

function vMenu() {
  if (!ui.menu) return "";
  const th = getTheme();
  return `<div class="drawer-scrim scrim ${ui.menuFresh ? "fresh" : ""}" data-act="close-menu"><nav class="drawer" aria-label="Menu" data-stop>
    <div class="who"><span class="av">${esc(initials())}</span><div style="min-width:0"><h3>${esc(S.profile.name || "Guest")}</h3><p class="small">${S.profile.method === "google" ? "Signed in with Google" : "Username account"}</p></div></div>
    <span class="eyebrow lbl">Settings</span>
    <button class="nav" data-act="menu-kitchen">${ic("basket", 22)}Kitchen & cuisines</button>
    <div style="padding:6px 12px 0"><div class="tabs" role="radiogroup" aria-label="Appearance">${[["system","System"],["light","Light"],["dark","Dark"]].map(([k, l]) => `<button role="radio" aria-checked="${th === k}" class="${th === k ? "on" : ""}" data-act="theme" data-v="${k}">${l}</button>`).join("")}</div></div>
    <button class="nav" style="margin-top:auto;color:var(--muted)" data-act="sign-out">${ic("out", 22)}Sign out</button>
  </nav></div>`;
}

function vApp() {
  const body = ui.tab === "grocery" ? vGrocery() : ui.tab === "past" ? vPast() : vToday();
  const open = S.grocery.filter(g => !g.done).length;
  const tabs = [["today","pot","Today's recipe"],["grocery","list","Grocery list"],["past","book","Past recipes"]];
  return `<div class="screen withtabs" id="scroll"><div class="stack" style="gap:16px;flex:1">${appBar()}${body}</div></div>
    <nav class="tabbar" aria-label="Sections">${tabs.map(([k, i, l]) => `<button class="${ui.tab === k ? "on" : ""}" aria-current="${ui.tab === k ? "page" : "false"}" data-act="nav" data-v="${k}">${ic(i, 22)}${l}${k === "grocery" && open ? `<span class="badge">${open}</span>` : ""}</button>`).join("")}</nav>
    ${vSheet()}${vMenu()}`;
}

/* ---------- render ---------- */
let lastKey = "";
function render() {
  const app = document.getElementById("app");
  const key = ui.screen + ui.tab + ui.view;
  const sc = app.querySelector(".screen"), top = sc ? sc.scrollTop : 0;
  const sheetEl = app.querySelector(".sheet"), sheetTop = sheetEl ? sheetEl.scrollTop : 0;
  const focusId = document.activeElement?.id;
  let html = "";
  if (ui.screen === "welcome") html = vWelcome();
  else if (ui.screen === "auth") html = vAuth();
  else if (ui.screen === "appliances") html = vAppliances();
  else if (ui.screen === "cuisines") html = vCuisinePrefs();
  else html = vApp();
  if (ui.toast) html += `<div class="toast ${ui.sheet ? "up" : ""}" role="status">${esc(ui.toast)}</div>`;
  app.innerHTML = html;
  ui.menuFresh = false;   // the drawer slides in once, not on every re-render
  const nsc = app.querySelector(".screen");
  if (nsc && key === lastKey) nsc.scrollTop = top; else if (nsc) nsc.scrollTop = 0;
  const nsh = app.querySelector(".sheet"); if (nsh) nsh.scrollTop = sheetTop;
  if (focusId) { const f = document.getElementById(focusId); if (f && (f.tagName === "INPUT" || f.tagName === "TEXTAREA")) f.focus(); }
  lastKey = key;
  if (ui.view === "loading" && ui.gen) paintProgress();
}

/* ---------- events ---------- */
const A = {
  "slide-next": () => { if (ui.slide < 2) ui.slide++; else ui.screen = "auth"; },
  "go-auth": () => { ui.screen = "auth"; if (ui.slide === 2) ui.authTab = "login"; },
  "auth-tab": v => { ui.authTab = v; ui.authErr = ""; },
  google: () => signIn("Google user", "google"),
  "tog-app": v => { const s = S.profile.appliances; const i = s.indexOf(v); i < 0 ? s.push(v) : s.splice(i, 1); save("profile"); },
  "tog-cui": v => { const s = S.profile.cuisines; const i = s.indexOf(v); i < 0 ? s.push(v) : s.splice(i, 1); save("profile"); },
  "to-cuisines": () => { ui.screen = "cuisines"; },
  "to-appliances": () => { ui.screen = "appliances"; },
  "finish-onboard": () => { S.profile.onboarded = true; save("profile"); ui.screen = "app"; ui.tab = "today"; ui.view = "home"; },
  tab: v => { ui.tab = v; if (v === "today" && ["loading"].includes(ui.view)) ctl?.abort(); },
  "go-home": () => { ui.view = "home"; ui.fromActive = false; },
  view: v => { if (v === "home") ui.view = "home"; else ui.view = v; if (v === "cuisine") ui.genErr = ""; },
  start: v => { ui.mode = v; ui.genErr = ""; if (!ui.meal) ui.meal = defaultMeal(); if (v === "have") ui.view = "method"; else { ui.ingredients = []; ui.view = "cuisine"; } },
  "rm-ing": v => { ui.ingredients.splice(+v, 1); },
  mic: () => toggleVoice(),
  "voice-use": () => { useVoiceText(); return true; },
  "tog-pick": v => { const i = ui.cuisines.indexOf(v); i < 0 ? ui.cuisines.push(v) : ui.cuisines.splice(i, 1); },
  "clear-picks": () => { ui.cuisines = []; },
  "more-cuisines": () => { ui.showAllCuisines = !ui.showAllCuisines; },
  meal: v => { ui.meal = v; },
  find: () => { ui.craving = ""; ui.filters = { time: "any", buy: "any", cuisine: "any", sort: "match" }; generate(false); return true; },
  regen: () => { generate(true); return true; },
  stop: () => { ctl?.abort(); return true; },
  "clear-filters": () => { ui.filters = { ...ui.filters, time: "any", buy: "any", cuisine: "any" }; },
  "open-recipe": v => { ui.selected = ui.results.find(r => r.id === v); ui.view = "detail"; ui.fromActive = false; ui.detailErr = ""; loadDetail(ui.selected); },
  "retry-detail": () => { ui.detailErr = ""; loadDetail(ui.selected); },
  "back-results": () => { ctl?.abort(); ui.view = "results"; },
  "open-active": v => { ui.selected = S.cooking.find(c => c.cid === v); ui.view = "detail"; ui.fromActive = true; },
  "stop-cooking": v => { S.cooking = S.cooking.filter(c => c.cid !== v); save("cooking"); },
  cook: () => cookRecipe(ui.selected),
  "mark-cooked": v => markCooked(v),
  "tog-groc": v => { const g = S.grocery.find(x => x.id === v); if (g) g.done = !g.done; save("grocery"); },
  "rm-groc": v => { S.grocery = S.grocery.filter(x => x.id !== v); save("grocery"); },
  "clear-checked": () => { S.grocery = S.grocery.filter(x => !x.done); save("grocery"); },
  "copy-list": () => {
    const text = S.grocery.filter(g => !g.done).map(g => "• " + g.name).join("\n");
    navigator.clipboard?.writeText(text).then(() => toast("Grocery list copied"), () => toast("Couldn't copy. Long-press to select instead."));
  },
  "open-past": v => { const e = S.history.find(x => x.id === v); ui.sheet = { type: "past", id: v, draft: { rating: e.rating, notes: e.notes, changes: e.changes } }; },
  rate: v => { ui.sheet.draft.rating = +v; },
  "save-past": () => { const e = S.history.find(x => x.id === ui.sheet.id); Object.assign(e, ui.sheet.draft); save("history"); ui.sheet = null; toast("Notes saved"); return true; },
  "cook-again": () => { const e = S.history.find(x => x.id === ui.sheet.id); ui.sheet = null; cookRecipe(e.recipe); },
  "open-settings": () => { ui.sheet = { type: "settings" }; },
  "close-sheet": () => { ui.sheet = null; },
  "sign-out": () => { S.profile.signedIn = false; save("profile"); ui.sheet = null; ui.menu = false; ui.screen = "auth"; ui.authTab = "login"; },
  "open-menu": () => { ui.menu = true; ui.menuFresh = true; },
  "close-menu": () => { ui.menu = false; },
  nav: v => { ui.menu = false; if (v === "today" && ui.tab === "today") { ctl?.abort(); ui.view = "home"; } ui.tab = v; },   // Today keeps an open flow; tapping it again goes home
  "menu-kitchen": () => { ui.menu = false; ui.sheet = { type: "settings" }; },
  theme: v => { try { localStorage.setItem("recime:theme", v); } catch (e) {} applyTheme(v); }
};

function signIn(name, method) {
  S.profile.name = name; S.profile.method = method; S.profile.signedIn = true; save("profile");
  ui.authErr = ""; ui.screen = S.profile.onboarded ? "app" : "appliances"; ui.tab = "today"; ui.view = "home"; render();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("scrim") && e.target.closest("[data-stop]")) return;   // clicks inside a sheet don't close it
  if (el.type === "checkbox") return;   // handled on change
  e.preventDefault();
  const done = A[el.dataset.act]?.(el.dataset.v, el);
  if (done !== true) render();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "photo-input") { handlePhoto(el.files?.[0]); el.value = ""; }
  else if (el.dataset?.act === "tog-groc") { A["tog-groc"](el.dataset.v); render(); }
  else if (el.dataset?.filter) { ui.filters[el.dataset.filter] = el.value; render(); }
});
document.addEventListener("input", e => {
  const m = e.target.dataset?.model;
  if (m === "voice") ui.voice.text = e.target.value;
  else if (m === "craving") ui.craving = e.target.value;
  else if (m && ui.sheet?.draft) ui.sheet.draft[m] = e.target.value;
  if (e.target.id === "auth-user") ui.draft.user = e.target.value;
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "auth-form") {
    const u = document.getElementById("auth-user").value.trim(), p = document.getElementById("auth-pass").value;
    if (u.length < 3) ui.authErr = "Usernames need at least 3 characters.";
    else if (p.length < 6) ui.authErr = "Passwords need at least 6 characters.";
    else return signIn(u, "password");
    render();
  } else if (f.id === "ing-form") {
    const inp = document.getElementById("ing-input");
    addIngredients(inp.value.split(",")); inp.value = ""; render(); document.getElementById("ing-input")?.focus();
  } else if (f.id === "crave-form") {
    ui.craving = document.getElementById("crave-input").value.trim();
    generate(true);
  } else if (f.id === "groc-form") {
    const inp = document.getElementById("groc-input"), v = inp.value.trim();
    if (v) { S.grocery.push({ id: uid(), name: v, recipe: "", done: false }); save("grocery"); }
    render(); document.getElementById("groc-input")?.focus();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && (ui.sheet || ui.menu)) { ui.sheet = null; ui.menu = false; render(); } });

/* ---------- boot ---------- */
store.loadLocal();
if (S.profile.signedIn) ui.screen = S.profile.onboarded ? "app" : "appliances";
render();
store.connect();
</script>
</body>
</html>
